<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qalam — Remote work, by Afghan women</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap');

:root{
  --indigo:#14213D; --indigo-deep:#0D1729; --paper:#F7F5F0;
  --gold:#C9A227; --gold-soft:#E7D28F; --teal:#1B4B43; --ink:#1A1A22;
  --line:rgba(20,33,61,0.14); --danger:#8B2E2E;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Public Sans',sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;color:var(--indigo-deep);}
a{color:inherit;} img{max-width:100%;display:block;}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px;}
@media(max-width:640px){.wrap{padding:0 20px;}}

header{position:sticky;top:0;z-index:40;background:rgba(247,245,240,0.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;max-width:1120px;margin:0 auto;flex-wrap:wrap;gap:10px;}
.logo{font-family:'Fraunces',serif;font-weight:700;font-size:1.3rem;color:var(--indigo-deep);text-decoration:none;}
.navlinks{display:flex;gap:26px;font-size:0.92rem;font-weight:500;align-items:center;flex-wrap:wrap;}
.navlinks a, .navlinks button{text-decoration:none;opacity:0.75;cursor:pointer;background:none;border:none;font:inherit;color:inherit;}
.navlinks a:hover, .navlinks button:hover{opacity:1;}
.navcta{background:var(--indigo-deep);color:var(--paper);padding:9px 18px;border-radius:3px;text-decoration:none;font-size:0.88rem;font-weight:600;border:none;cursor:pointer;}
.pill{font-size:0.78rem;background:var(--gold-soft);color:var(--indigo-deep);padding:3px 10px;border-radius:20px;font-weight:700;}
